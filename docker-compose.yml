services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_WS_URL=ws://localhost:8000/ws
